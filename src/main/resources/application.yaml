spring:
  application:
    name: flowmanager

  # --- База данных ---
  datasource:
    url: jdbc:postgresql://localhost:5432/flowmanager
    username: flowmanager
    password: flowmanager
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # схему создаёт Liquibase, Hibernate её не трогает
    open-in-view: false    # отключаем OSIV, чтобы не тащить сессию в контроллер
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # --- Kafka ---
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                 # ждём подтверждения от всех реплик — важно, не хотим терять события об отправке файла на конвертацию
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false   # не добавлять заголовок с именем Java-класса в сообщение

    consumer:
      group-id: flowmanager-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest   # не пропустить события о завершении конвертации, отправленные пока сервис не работал
      properties:
        spring.json.trusted.packages: "com.example.flowmanager.kafka.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.flowmanager.kafka.dto.ConversionResultEvent

    listener:
      ack-mode: manual_immediate   # ручной коммит оффсета — подтверждаем только после успешной обработки события и записи в БД

  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB     # лимит на размер одного файла
      max-request-size: 200MB

# --- Topic names (свои переменные, читаются через @ConfigurationProperties или @Value) ---
app:
  kafka:
    topics:
      file-uploaded: file-converter-input        # FlowManager -> ConversionService
      file-converted: file-converter-output      # ConversionService -> FlowManager
  minio:
    url: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: files
    secure: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.apache.kafka: WARN     # клиент Kafka по умолчанию очень "разговорчив" в INFO
    com.example.flowmanager: DEBUG